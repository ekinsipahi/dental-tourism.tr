{% load i18n %}{% if page_obj.has_other_pages %}
<nav class="pagination" aria-label="{% trans 'Pagination' %}">
  {% if page_obj.has_previous %}<a href="?page={{ page_obj.previous_page_number }}" rel="prev">← {% trans "Previous" %}</a>{% endif %}
  <span class="current">{{ page_obj.number }} / {{ page_obj.paginator.num_pages }}</span>
  {% if page_obj.has_next %}<a href="?page={{ page_obj.next_page_number }}" rel="next">{% trans "Next" %} →</a>{% endif %}
</nav>
{% endif %}
